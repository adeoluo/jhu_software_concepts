{% extends "base.html" %}

{% block title %}{{ profile.name }} | Contact{% endblock %}

{% block content %}
<section class="page-content" aria-labelledby="contact-heading">
  <p class="eyebrow">Contact</p>
  <h1 id="contact-heading">Let's connect.</h1>
  <div class="contact-list">
    <div>
      <h2>Email</h2>
      <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
    </div>
    <div>
      <h2>LinkedIn</h2>
      <a href="{{ profile.linkedin_url }}" target="_blank" rel="noreferrer">{{ profile.linkedin_url }}</a>
    </div>
    <div>
      <h2>GitHub</h2>
      <a href="{{ profile.github_url }}" target="_blank" rel="noreferrer">{{ profile.github_url }}</a>
    </div>
  </div>
</section>
{% endblock %}
